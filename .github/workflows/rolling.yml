name: Rolling release

# Recreates the "rolling" GitHub Release with the latest wheel after CI
# passes on main. Marked prerelease + not-latest so it never shadows a real
# tagged release.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: rolling
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: rebuild rolling release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: build
        run: uv build

      - name: delete existing rolling tag and release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rolling --cleanup-tag --yes --repo "${{ github.repository }}" || true

      - name: create rolling release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: rolling
          name: "Rolling (main)"
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          prerelease: true
          make_latest: "false"
          body: "Built from main @ ${{ github.event.workflow_run.head_sha }}"
          files: |
            dist/*.whl
            dist/*.tar.gz
